name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install ruff
      - run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install pip-audit
      - name: Known vulnerabilities in the pinned dependencies (direct and transitive)
        run: pip-audit --strict --no-deps --disable-pip -r requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # also keeps the dlib wheel, which is built from source
      - name: System libraries (dlib build, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0t64 libgl1
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip  # older Pythons bundle a pip with known vulnerabilities
          pip install -r requirements.txt pytest pip-audit
      - name: Installed packages are consistent and free of known vulnerabilities
        run: |
          pip check
          pip-audit --strict --progress-spinner off
      - run: python -m pytest -v
